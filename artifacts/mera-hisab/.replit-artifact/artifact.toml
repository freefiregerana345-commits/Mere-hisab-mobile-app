kind = "mobile"
previewPath = "/mera-hisab/"
title = "Mera Hisab"
description = "An offline-first Android shop companion for billing, khata, customers, products, inventory, payments, reports, and local backup."
version = "1.0.0"
id = "artifacts/mera-hisab"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mera-hisab/" ]
localPort = 22922

[services.development]
run = "pnpm --filter @workspace/mera-hisab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mera-hisab", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mera-hisab", "run", "serve" ]

[services.env]
PORT = "22922"
BASE_PATH = "/mera-hisab/"
